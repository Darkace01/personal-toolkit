<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Toolkit – Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }
    header {
      padding: 16px 24px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
    header h1 { font-size: 18px; }
    main { max-width: 860px; margin: 0 auto; padding: 24px; }
    h2 { font-size: 15px; margin-bottom: 12px; color: #58a6ff; }
    .snippet-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-primary { background: #238636; border-color: transparent; }
    .btn:hover { opacity: 0.85; }
    .snippet-list { display: flex; flex-direction: column; gap: 8px; }
    .snippet-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 16px;
    }
    .snippet-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .snippet-name { font-weight: 600; flex: 1; }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 12px;
      background: #21262d;
      color: #8b949e;
    }
    .badge.enabled { background: #23863622; color: #3fb950; }
    .snippet-meta { font-size: 12px; color: #8b949e; margin-bottom: 6px; }
    .snippet-actions { display: flex; gap: 6px; margin-top: 8px; }
    .snippet-actions .btn { padding: 4px 10px; font-size: 12px; }
    .btn-danger { background: #da363322; border-color: #da3633; color: #f85149; }
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 15px; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    label { font-size: 12px; color: #8b949e; }
    input, select, textarea {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }
    textarea { min-height: 140px; font-family: 'SFMono-Regular', Consolas, monospace; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #empty-state { color: #6e7681; font-style: italic; padding: 16px 0; }
  </style>
</head>
<body>
  <header>
    <h1>🛠 Personal Toolkit – Options</h1>
  </header>
  <main>
    <h2>CSS Snippet Manager</h2>
    <div class="snippet-toolbar">
      <button class="btn btn-primary" id="add-snippet-btn">+ Add Snippet</button>
    </div>
    <div class="snippet-list" id="snippet-list">
      <div id="empty-state">No snippets yet. Click "Add Snippet" to get started.</div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">Add CSS Snippet</h3>
      <div class="form-group">
        <label for="f-name">Name</label>
        <input id="f-name" type="text" placeholder="My custom style" />
      </div>
      <div class="form-group">
        <label for="f-desc">Description (optional)</label>
        <input id="f-desc" type="text" placeholder="What this snippet does" />
      </div>
      <div class="form-group">
        <label for="f-pattern-type">URL Pattern Type</label>
        <select id="f-pattern-type">
          <option value="all">All URLs</option>
          <option value="domain">Domain</option>
          <option value="exact">Exact URL</option>
          <option value="wildcard">Wildcard</option>
        </select>
      </div>
      <div class="form-group" id="f-pattern-group">
        <label for="f-pattern">URL Pattern</label>
        <input id="f-pattern" type="text" placeholder="e.g. github.com or https://example.com/page" />
      </div>
      <div class="form-group">
        <label for="f-css">CSS</label>
        <textarea id="f-css" placeholder="body { background: red; }"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="options.ts"></script>
</body>
</html>
